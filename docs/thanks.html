<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>订单已提交 · 译匠</title>
<style>
  html,body{margin:0;height:100%;background:#08090c;color:#eef2f6;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  .box{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px}
  .tick{width:54px;height:54px;border-radius:50%;border:1px solid rgba(127,227,255,.45);
    display:grid;place-items:center;margin:0 auto 18px;color:#7fe3ff;font-size:24px}
  h1{font-family:"Songti SC",Georgia,serif;font-weight:500;font-size:30px;margin:0 0 10px}
  p{color:#8c97a5;font-size:14px;line-height:1.9;margin:6px 0}
  a{display:inline-block;margin-top:20px;padding:11px 20px;border:1px solid rgba(255,255,255,.18);
    border-radius:10px;color:#eef2f6;text-decoration:none;font-size:14px}
  a:hover{border-color:rgba(127,227,255,.5);color:#7fe3ff}
  .hint{font-size:12px;color:#5d6773;margin-top:18px}
</style>
</head>
<body>
  <div class="box">
    <div>
      <div class="tick">✓</div>
      <h1>订单信息已收到</h1>
      <p>我会在 24 小时内把激活码发到你填的邮箱。</p>
      <p>拿到码后，在 App 的「设置 → 授权」里粘贴激活。</p>
      <a href="index.html">回到首页</a>
      <div class="hint">超过 24 小时没收到：微信搜索【译匠公众号】留言，附订单号。</div>
    </div>
  </div>
</body>
</html>
